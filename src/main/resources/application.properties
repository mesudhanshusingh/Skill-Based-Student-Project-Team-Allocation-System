# Server Configuration
server.port=8080

# Default In-Memory H2 Database Configuration (Runs out-of-the-box with 'mvn spring-boot:run')
spring.datasource.url=jdbc:h2:mem:team_allocation_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: To use MySQL instead of H2, comment out H2 properties above and uncomment below:
# spring.datasource.url=jdbc:mysql://localhost:3306/team_allocation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
